# Topic catalog loaded by `curator seed` (upsert by slug; nothing is deleted).
# A child's slug is its parent's slug, "/", then one lowercase-hyphenated segment. Topics nest at
# most two levels deep (the Android topic picker shows two).
# related: slugs whose stories also suit followers of this topic (stored once per pair).
# hints: source URLs and feeds Claude should check when fetching this topic.
- slug: languages
  name: Languages
  description: Programming language releases, proposals and toolchains.
  children:
    - slug: languages/go
      name: Go
      hints: [https://go.dev/blog/feed.atom]
    - slug: languages/python
      name: Python
      related: [ai/frameworks]
    - slug: languages/javascript
      name: JavaScript & TypeScript
      related: [web/nodejs]
      hints: [https://devblogs.microsoft.com/typescript/feed/]
    - slug: languages/rust
      name: Rust
      hints:
        - https://blog.rust-lang.org/feed.xml
        - https://github.com/rust-lang/rust/releases.atom
    - slug: languages/kotlin
      name: Kotlin
      related: [mobile/android, mobile/kmp]
      hints:
        - https://blog.jetbrains.com/kotlin/feed/
        - https://github.com/JetBrains/kotlin/releases.atom
    - slug: languages/swift
      name: Swift
      related: [mobile/ios]
    - {slug: languages/java, name: Java}
- slug: web
  name: Web
  description: Web frameworks, runtimes and browser platform changes.
  children:
    - slug: web/react
      name: React
      related: [web/nextjs, mobile/react-native]
    - {slug: web/nextjs, name: Next.js}
    - {slug: web/angular, name: Angular}
    - {slug: web/vue, name: Vue}
    - slug: web/nodejs
      name: Node.js
      hints: [https://nodejs.org/en/feed/blog.xml]
    - {slug: web/browsers, name: Browsers}
- slug: mobile
  name: Mobile
  description: Mobile platforms, SDKs and cross-platform frameworks.
  children:
    - slug: mobile/android
      name: Android
      hints: [https://android-developers.googleblog.com/feeds/posts/default]
    - {slug: mobile/ios, name: iOS}
    - {slug: mobile/flutter, name: Flutter}
    - {slug: mobile/react-native, name: React Native}
    - {slug: mobile/kmp, name: Kotlin Multiplatform}
- slug: cloud
  name: Cloud & Infrastructure
  description: Cloud providers, containers and infrastructure tooling.
  children:
    - {slug: cloud/aws, name: AWS}
    - {slug: cloud/gcp, name: Google Cloud}
    - {slug: cloud/azure, name: Azure}
    - slug: cloud/kubernetes
      name: Kubernetes
      related: [cloud/docker]
      hints: [https://kubernetes.io/feed.xml]
    - {slug: cloud/docker, name: Docker}
    - {slug: cloud/terraform, name: Terraform}
- slug: databases
  name: Databases
  description: Database engines, drivers and managed data services.
  children:
    - {slug: databases/postgres, name: PostgreSQL}
    - {slug: databases/mysql, name: MySQL}
    - {slug: databases/redis, name: Redis}
    - {slug: databases/mongodb, name: MongoDB}
    - {slug: databases/sqlite, name: SQLite}
- slug: ai
  name: AI & ML
  description: Model releases, AI APIs and ML frameworks.
  children:
    - slug: ai/models
      name: Models & APIs
      related: [ai/frameworks]
    - {slug: ai/frameworks, name: ML Frameworks}
- slug: security
  name: Security
  description: Vulnerabilities, advisories and security incidents.
  children:
    - slug: security/advisories
      name: Advisories & CVEs
      related: [security/supply-chain]
      hints:
        - https://github.com/advisories
        - https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    - slug: security/supply-chain
      name: Supply Chain
      related: [devtools/github]
    - {slug: security/incidents, name: Incidents & Breaches}
- slug: devtools
  name: Developer Tools
  description: Editors, CI/CD, version control and build tooling.
  children:
