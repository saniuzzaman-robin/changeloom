name: CI

# Backend, curator and image checks; skipped when only the app changed. A passing run on main
# triggers Deploy api, so app-only pushes never deploy the backend.
on:
  push:
    branches: [main, staging]
    paths:
      - backend/**
      - curator/**
      - api/**
      - deploy/**
      - Makefile
      - docker-compose.yml
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - backend/**
      - curator/**
      - api/**
      - deploy/**
      - Makefile
      - docker-compose.yml
      - .github/workflows/ci.yml

permissions:
  contents: read

# One run per branch or PR; a newer push cancels an older PR run, but runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned by commit SHA (Dependabot keeps them current).
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: changeloom
          POSTGRES_PASSWORD: changeloom
          POSTGRES_DB: changeloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeloom -d changeloom"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://changeloom:changeloom@localhost:5432/changeloom?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: |
          make -C .. generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "Run make generate and commit the result."; exit 1; }
      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  curator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: curator
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: changeloom
          POSTGRES_PASSWORD: changeloom
          POSTGRES_DB: changeloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeloom -d changeloom"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://changeloom:changeloom@localhost:5432/changeloom?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: curator/go.mod
          cache-dependency-path: curator/go.sum
      - name: Generated code is up to date
        run: |
          make -C .. curator-generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "Run make curator-generate and commit the result."; exit 1; }
      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t changeloom-backend backend
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: changeloom-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
