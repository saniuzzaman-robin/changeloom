name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: changeloom
          POSTGRES_PASSWORD: changeloom
          POSTGRES_DB: changeloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeloom -d changeloom"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://changeloom:changeloom@localhost:5432/changeloom?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run ./...

  curator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curator
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: changeloom
          POSTGRES_PASSWORD: changeloom
          POSTGRES_DB: changeloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeloom -d changeloom"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://changeloom:changeloom@localhost:5432/changeloom?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: curator/go.mod
          cache-dependency-path: curator/go.sum
      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t changeloom-backend backend

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug
