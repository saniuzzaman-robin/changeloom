name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch or PR; a newer push cancels an older PR run, but runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned by commit SHA (Dependabot keeps them current).
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: changeloom
          POSTGRES_PASSWORD: changeloom
          POSTGRES_DB: changeloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeloom -d changeloom"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://changeloom:changeloom@localhost:5432/changeloom?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: |
          make -C .. generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "Run make generate and commit the result."; exit 1; }
      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  curator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: curator
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: changeloom
          POSTGRES_PASSWORD: changeloom
          POSTGRES_DB: changeloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeloom -d changeloom"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://changeloom:changeloom@localhost:5432/changeloom?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: curator/go.mod
          cache-dependency-path: curator/go.sum
      - name: Generated code is up to date
        run: |
          make -C .. curator-generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "Run make curator-generate and commit the result."; exit 1; }
      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t changeloom-backend backend
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: changeloom-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # The release build requires Firebase config; CI only compiles, so a placeholder for the
      # app id is enough. Real config is never committed.
      - name: Placeholder Firebase config
        run: |
          cat > androidApp/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "changeloom-ci",
              "storage_bucket": "changeloom-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "dev.changeloom.android.staging" }
                },
                "oauth_client": [
                  { "client_id": "ci.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [{ "current_key": "ci-placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
      # The release build also requires an https api URL; this one is never called. The placeholder
      # Firebase project can't take Crashlytics mapping uploads.
      - run: >-
          ./gradlew
          -Pchangeloom.staging.apiBaseUrl=https://ci.invalid
          -Pchangeloom.allowUnsignedRelease=true
          -Pchangeloom.crashlyticsMappingUpload=false
          :shared:testAndroidHostTest
          :androidApp:testStagingDebugUnitTest
          :androidApp:lintStagingDebug
          :androidApp:assembleStagingRelease
