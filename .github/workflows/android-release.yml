name: Android release

# Staging: on pushes to main that touch the app, build the signed staging release APK and send it
# to Firebase App Distribution.
# Prod: on a v<major>.<minor>.<patch> tag, after the production environment's reviewers approve,
# build the signed prod AAB and upload it to Play's internal track.
# versionCode is this workflow's run number plus ANDROID_VERSION_CODE_OFFSET, so it only grows.
# Setup (WIF, service accounts, GitHub environments): deploy/README.md, Continuous deployment.
on:
  push:
    branches: [main]
    # Path filters don't apply to tag pushes.
    paths: [mobile/**, .github/workflows/android-release.yml]
    tags: [v*]

permissions:
  contents: read
  id-token: write

# Third-party actions are pinned by commit SHA (Dependabot keeps them current).
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    concurrency:
      group: android-release-${{ github.ref_type }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mobile
    env:
      FLAVOR: ${{ github.ref_type == 'tag' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Firebase config and signing key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for key in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n ${!key} ]] || { echo "Set the $key secret on the ${{ github.ref_type == 'tag' && 'production' || 'staging' }} environment (deploy/README.md)."; exit 1; }
          done
          mkdir -p "androidApp/src/$FLAVOR"
          jq -e . <<<"$GOOGLE_SERVICES_JSON" > "androidApp/src/$FLAVOR/google-services.json" \
            || { echo "GOOGLE_SERVICES_JSON is not valid JSON"; exit 1; }
          base64 -d <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/upload.jks"
          # Backslashes are escapes in .properties files.
          esc() { printf '%s' "${1//\\/\\\\}"; }
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > keystore.properties
      - name: Build
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
          VERSION_CODE_OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET }}
          ADMOB_APP_ID: ${{ vars.ANDROID_ADMOB_APP_ID }}
          ADMOB_NATIVE_AD_UNIT_ID: ${{ vars.ANDROID_ADMOB_NATIVE_AD_UNIT_ID }}
        run: |
          [[ $API_BASE_URL == https://* ]] || { echo "Set ANDROID_API_BASE_URL (the env's Cloud Run https URL) on the environment."; exit 1; }
          [[ ${VERSION_CODE_OFFSET:-0} =~ ^[0-9]+$ ]] || { echo "ANDROID_VERSION_CODE_OFFSET must be a whole number"; exit 1; }
          props=(
            "-Pchangeloom.$FLAVOR.apiBaseUrl=$API_BASE_URL"
            "-Pchangeloom.versionCode=$((GITHUB_RUN_NUMBER + ${VERSION_CODE_OFFSET:-0}))"
          )
          if [[ $FLAVOR == prod ]]; then
            [[ $GITHUB_REF_NAME =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "release tags look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
            props+=("-Pchangeloom.versionName=${BASH_REMATCH[1]}")
            [[ -n $ADMOB_APP_ID && -n $ADMOB_NATIVE_AD_UNIT_ID ]] || { echo "Set ANDROID_ADMOB_APP_ID and ANDROID_ADMOB_NATIVE_AD_UNIT_ID on the production environment."; exit 1; }
            props+=("-Pchangeloom.prod.admobAppId=$ADMOB_APP_ID" "-Pchangeloom.prod.admobNativeAdUnitId=$ADMOB_NATIVE_AD_UNIT_ID")
            ./gradlew "${props[@]}" :androidApp:bundleProdRelease
          else
            ./gradlew "${props[@]}" :androidApp:assembleStagingRelease
          fi
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_RELEASE_SA }}
      - name: Send to Firebase App Distribution
        if: env.FLAVOR == 'staging'
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          TESTER_GROUPS: ${{ vars.APP_DISTRIBUTION_GROUPS }}
        run: |
          [[ -n $FIREBASE_ANDROID_APP_ID && -n $TESTER_GROUPS ]] \
            || { echo "Set FIREBASE_ANDROID_APP_ID and APP_DISTRIBUTION_GROUPS on the staging environment."; exit 1; }
          npx --yes firebase-tools@15.32.1 appdistribution:distribute \
            androidApp/build/outputs/apk/staging/release/androidApp-staging-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" --groups "$TESTER_GROUPS" \
            --release-notes "$(git log -1 --format='%h %s')"
      - name: Upload to Play (internal track)
        if: env.FLAVOR == 'prod'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: dev.changeloom.android
          releaseFiles: mobile/androidApp/build/outputs/bundle/prodRelease/androidApp-prod-release.aab
          track: internal
          # "draft" until the app's first release is out of draft in Play Console.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
