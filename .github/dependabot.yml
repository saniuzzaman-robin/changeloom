version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /curator
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      curator:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /mobile
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      mobile:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
