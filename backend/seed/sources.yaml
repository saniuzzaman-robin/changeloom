# Sources synced into the `sources` table by `worker sources sync` (upsert by name; nothing is deleted).
# kind: rss | gh_advisory | kev | hn. `config` is validated per kind; `topics` are default topic slugs.
# poll_interval is a Go duration (minimum 1m). Set `disabled: true` to stop polling a source.
- name: Go Blog
  kind: rss
  poll_interval: 2h
  topics: [languages/go]
  config: {url: "https://go.dev/blog/feed.atom"}
- name: Rust Blog
  kind: rss
  poll_interval: 2h
  topics: [languages/rust]
  config: {url: "https://blog.rust-lang.org/feed.xml"}
- name: Rust Releases
  kind: rss
  poll_interval: 2h
  topics: [languages/rust]
  config: {url: "https://github.com/rust-lang/rust/releases.atom"}
- name: Kotlin Blog
  kind: rss
  poll_interval: 2h
  topics: [languages/kotlin]
  config: {url: "https://blog.jetbrains.com/kotlin/feed/"}
- name: Kotlin Releases
  kind: rss
  poll_interval: 2h
  topics: [languages/kotlin]
  config: {url: "https://github.com/JetBrains/kotlin/releases.atom"}
- name: TypeScript Blog
  kind: rss
  poll_interval: 2h
  topics: [languages/javascript]
  config: {url: "https://devblogs.microsoft.com/typescript/feed/"}
- name: Node.js Blog
  kind: rss
  poll_interval: 2h
  topics: [web/nodejs]
  config: {url: "https://nodejs.org/en/feed/blog.xml"}
- name: Android Developers Blog
  kind: rss
  poll_interval: 2h
  topics: [mobile/android]
  config: {url: "https://android-developers.googleblog.com/feeds/posts/default"}
- name: Kubernetes Blog
  kind: rss
  poll_interval: 2h
  topics: [cloud/kubernetes]
  config: {url: "https://kubernetes.io/feed.xml"}
- name: GitHub Advisories (critical)
  kind: gh_advisory
  poll_interval: 1h
  topics: [security/advisories]
  config: {severity: critical}
- name: CISA KEV
  kind: kev
  poll_interval: 6h
  topics: [security/advisories]
- name: Hacker News (150+ points)
  kind: hn
  poll_interval: 1h
  topics: []
  config: {min_points: 150, query: "release"}
